<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Marginal: a sheet on the desk, a chalk margin note, and its dots -->
  <rect x="4" y="4" width="120" height="120" rx="14" fill="#0f0f0f"/>
  <!-- the sheet -->
  <rect x="38" y="26" width="74" height="96" rx="3" fill="#e8e6df"/>
  <!-- the chalk note hanging on the margin, with its dashed thread -->
  <path d="M 40 40 C 26 44, 20 52, 22 62" stroke="#b8b6ae" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <rect x="6" y="24" width="52" height="26" rx="2" fill="#232323"/>
  <text x="12" y="42" font-family="cursive" font-size="13" fill="#eeeeea">mârginal</text>
  <!-- the anchor dots: pin red on the sheet, margin blue in the desk -->
  <circle cx="40" cy="40" r="5" fill="#e24848"/>
  <circle cx="14" cy="30" r="4" fill="#a7d5f5"/>
</svg>
